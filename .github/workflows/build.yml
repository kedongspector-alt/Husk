name: Build Husk IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # lets you click "Run workflow" from the Actions tab

jobs:
  build:
    # Use macos-latest — macos-14 label can be restricted on some accounts.
    # macos-latest currently points at macOS 14 arm64 anyway for Actions.
    runs-on: macos-latest
    timeout-minutes: 360   # 6 hours; the first build can take 2-4 hrs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install build tools
        run: |
          brew install meson ninja pkg-config xcodegen qemu
          # python3 is preinstalled; virglrenderer's meson wants pyyaml
          /opt/homebrew/bin/python3 -m pip install --break-system-packages pyyaml

      - name: Install Rust iOS target
        run: |
          rustup target add aarch64-apple-ios

      - name: Make scripts executable
        # Git on Windows doesn't preserve the +x bit, so scripts/*.sh come
        # through without it. Add it before anything runs them.
        run: |
          find scripts -name '*.sh' -type f -exec chmod +x {} +

      # Cache the heavy per-dependency sysroot so reruns are fast.
      # First build still takes hours; subsequent ones that only touch
      # the Java framework or Swift app finish in minutes.
      - name: Cache ios-arm64 sysroot
        uses: actions/cache@v4
        with:
          path: |
            build/ios-arm64/sysroot
            build/ios-arm64/lib
            build/ios-arm64/cross-darwin.meson
            build/ios-arm64/cross-ios-darwin.meson
          key: husk-sysroot-${{ runner.os }}-${{ hashFiles('scripts/build_ios.sh', 'scripts/build_gpu_ios.sh', 'scripts/build_angle_ios.sh', 'scripts/build_moltenvk_ios.sh', 'scripts/fetch_sources.sh') }}

      - name: Build
        run: ./scripts/ci_build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Husk-ipa
          path: |
            build/Husk.ipa
            build/Husk.tipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/**/meson-logs/**
            build/**/*.log
          if-no-files-found: ignore
